[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Security headers fallback (Next.js also sets these via next.config.ts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[functions."update-trending"]
  schedule = "0 */6 * * *"

[functions."weekly-digest"]
  schedule = "0 12 * * 0"

[functions."compute-leaderboard"]
  schedule = "0 0 * * 1"

[functions."check-badges"]
  schedule = "0 6 * * *"

[functions."reset-weekly-views"]
  schedule = "0 1 * * 1"
